<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- macOS-style rounded square on warm paper -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f3ea"/>
      <stop offset="1" stop-color="#e6dfd0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1b1a17" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <!-- the label: white sticker with a bolt pictogram, separator and text bars -->
  <g filter="url(#shadow)">
    <rect x="172" y="352" width="680" height="320" rx="40" fill="#ffffff"/>
  </g>
  <g fill="none" stroke="#1b1a17" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- bolt head -->
    <rect x="232" y="452" width="96" height="120" rx="12"/>
    <!-- threaded shank -->
    <path d="M328 480 L360 466 L392 494 L424 466 L456 494 L488 466 L512 480"/>
    <path d="M328 544 L360 558 L392 530 L424 558 L456 530 L488 558 L512 544"/>
    <path d="M512 480 L512 544"/>
    <!-- separator -->
    <path d="M580 420 L580 604"/>
  </g>
  <!-- text bars -->
  <rect x="632" y="440" width="180" height="70" rx="14" fill="#1b1a17"/>
  <rect x="632" y="540" width="108" height="40" rx="12" fill="#e4572e"/>
</svg>
